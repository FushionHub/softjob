; ==============================================================================
; Emporium Capitals — cPanel Shared Hosting Master php.ini
; ==============================================================================
; Used by LiteSpeed (lsphp), suPHP, and CLI invocations on cPanel.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
display_errors = Off
log_errors = On
error_log = cpanelsetup/error_log
expose_php = Off
date.timezone = UTC
