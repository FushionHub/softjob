<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center — Emporium Capitals Real-Time Alerts</title>
    <meta name="description" content="Stay updated with instant notifications on deposit confirmations, daily dividend yields, trade wins, and security events.">
    <link rel="icon" href="/assets/icon.png" type="image/png">
    <meta name="theme-color" content="#02040e">

    <!-- Fonts & CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#ef4d45',
                            secondary: '#8c0030',
                            accent: '#ff7d75',
                            teal: '#008c6e',
                            gold: '#f59e0b'
                        },
                        dark: {
                            base: '#02040e',
                            surface: '#05091a',
                            card: '#080f28',
                            cardHover: '#0e1738',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-base text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-primary selection:text-white">

    <!-- Universal Header & Real-Time Ticker -->
    <header id="app-header"></header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6">

        <!-- Title -->
        <div class="flex justify-between items-center border-b border-dark-border pb-4">
            <div>
                <h1 class="font-display font-black text-2xl sm:text-3xl text-white">Notifications</h1>
                <p class="text-xs text-slate-400">Vault transactions, dividends, and security alerts</p>
            </div>
            <button onclick="markAllRead()" class="text-xs font-bold text-brand-primary hover:underline flex items-center gap-1.5">
                <i data-lucide="check-check" class="w-4 h-4"></i> Mark all as read
            </button>
        </div>

        <!-- Notification Feed List -->
        <div class="space-y-3" id="notif-list">
            <div class="glass-card rounded-2xl p-8 border border-dark-border text-center text-slate-500 text-xs font-mono">
                Loading notifications...
            </div>
        </div>

    </main>

    <!-- Universal Footer -->
    <footer id="app-footer"></footer>

    <!-- Scripts -->
    <script src="/assets/js/app-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AppCore.init('notifications');
            loadNotifications();
        });

        async function loadNotifications() {
            const notifs = await AppCore.getRealNotifications();
            const container = document.getElementById('notif-list');
            if (!container) return;

            if (!notifs || notifs.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-12 border border-dark-border text-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mx-auto text-slate-500">
                            <i data-lucide="bell-off" class="w-6 h-6"></i>
                        </div>
                        <h4 class="font-bold text-white text-sm">No Notifications Yet</h4>
                        <p class="text-slate-400 text-xs max-w-sm mx-auto">
                            Your account is fully synchronized. Upcoming deposits, trades, withdrawals, and system notifications will be logged here in real time.
                        </p>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = notifs.map(n => {
                const type = n.type || 'info';
                let icon = 'bell';
                let iconColor = 'text-blue-400';
                let iconBg = 'bg-blue-500/20';
                let borderColor = 'hover:border-blue-500/40';

                if (type === 'deposit' || type === 'success') {
                    icon = 'arrow-down-left';
                    iconColor = 'text-emerald-400';
                    iconBg = 'bg-emerald-500/20';
                    borderColor = 'hover:border-emerald-500/40';
                } else if (type === 'withdrawal') {
                    icon = 'arrow-up-right';
                    iconColor = 'text-amber-400';
                    iconBg = 'bg-amber-500/20';
                    borderColor = 'hover:border-amber-500/40';
                } else if (type === 'trade') {
                    icon = 'activity';
                    iconColor = 'text-brand-primary';
                    iconBg = 'bg-brand-primary/20';
                    borderColor = 'hover:border-brand-primary/40';
                } else if (type === 'security') {
                    icon = 'shield-alert';
                    iconColor = 'text-amber-400';
                    iconBg = 'bg-amber-500/20';
                    borderColor = 'hover:border-amber-500/40';
                }

                const dateDisplay = n.created_at ? new Date(n.created_at).toLocaleString() : 'Recent';

                return `
                    <div class="glass-card rounded-2xl p-4 border border-dark-border flex items-start gap-4 ${borderColor} transition-all">
                        <div class="p-2.5 rounded-xl ${iconBg} ${iconColor} shrink-0">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1 space-y-1">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-white">${n.title || 'System Notification'}</h4>
                                <span class="text-[10px] text-slate-500 font-mono">${dateDisplay}</span>
                            </div>
                            <p class="text-xs text-slate-300">
                                ${n.message || ''}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }
        window.reloadPageData = loadNotifications;

        function markAllRead() {
            AppCore.showToast('All Read', 'All notifications marked as read.');
        }
    </script>
</body>
</html>
