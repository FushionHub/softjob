<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Emporium Capitals Institutional Recovery</title>
    <meta name="description" content="Recover access to your Emporium Capitals institutional wealth vault.">
    <link rel="icon" href="/assets/icon.png" type="image/png">
    <meta name="theme-color" content="#02040e">

    <!-- Fonts & CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#ef4d45',
                            secondary: '#8c0030',
                            accent: '#ff7d75',
                            teal: '#008c6e',
                            gold: '#f59e0b'
                        },
                        dark: {
                            base: '#02040e',
                            surface: '#05091a',
                            card: '#080f28',
                            cardHover: '#0e1738',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-base text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-primary selection:text-white">

    <!-- Top Nav -->
    <header class="py-6 px-4 sm:px-8 flex justify-between items-center max-w-7xl mx-auto w-full">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-secondary to-brand-primary flex items-center justify-center shadow-lg shadow-brand-primary/20">
                <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <div class="font-display font-black text-xl tracking-tight text-white flex items-center">
                    Emporium<span class="text-brand-primary ml-0.5">Capitals</span>
                </div>
                <div class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Institutional Wealth</div>
            </div>
        </a>
        <a href="/login/" class="text-xs font-bold text-slate-300 hover:text-white">
            Back to <span class="text-brand-primary">Sign In</span>
        </a>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="glass-card rounded-3xl p-6 sm:p-10 max-w-md w-full border border-dark-border space-y-6 shadow-2xl">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-brand-primary/20 text-brand-primary mx-auto flex items-center justify-center">
                    <i data-lucide="key-round" class="w-6 h-6"></i>
                </div>
                <h1 class="font-display font-black text-2xl sm:text-3xl text-white">Recover Password</h1>
                <p class="text-xs text-slate-400">Enter your registered email address and we'll dispatch an automated reset token</p>
            </div>

            <form onsubmit="handleReset(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300 block">Email Address</label>
                    <input type="email" id="reset-email" required placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-brand-primary">
                </div>

                <button type="submit" id="btn-reset" class="w-full py-3.5 rounded-xl glow-btn font-display font-black text-sm text-white shadow-xl shadow-brand-primary/20 flex items-center justify-center gap-2 transition-all hover:scale-[1.01]">
                    <i data-lucide="mail" class="w-4 h-4"></i>
                    <span>Send Reset Instructions</span>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
                Remembered your password? <a href="/login/" class="text-brand-primary font-bold hover:underline">Sign In</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-dark-border">
        &copy; 2026 Emporium Capitals. Universal CDN Architecture.
    </footer>

    <!-- Scripts -->
    <script src="/assets/js/app-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            AppCore.showToast('Instructions Sent', `Password recovery link has been dispatched to ${email}.`);
            setTimeout(() => window.location.href = '/login/', 2000);
        }
    </script>
</body>
</html>
