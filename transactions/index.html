<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History & Ledger — Emporium Capitals Institutional Records</title>
    <meta name="description" content="View complete ledger history of deposits, withdrawals, trading profits, and algorithmic dividend distributions.">
    <link rel="icon" href="/assets/icon.png" type="image/png">
    <meta name="theme-color" content="#02040e">

    <!-- Fonts & CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#ef4d45',
                            secondary: '#8c0030',
                            accent: '#ff7d75',
                            teal: '#008c6e',
                            gold: '#f59e0b'
                        },
                        dark: {
                            base: '#02040e',
                            surface: '#05091a',
                            card: '#080f28',
                            cardHover: '#0e1738',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dark-base text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-primary selection:text-white">

    <!-- Universal Header & Real-Time Ticker -->
    <header id="app-header"></header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">

        <!-- Title & Header Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">Audited Ledger</span>
                <h1 class="font-display font-black text-3xl sm:text-4xl text-white">Transaction Records</h1>
                <p class="text-xs text-slate-400">Complete historical activity log for account <span class="val-name font-bold text-slate-300">Chinex digital</span></p>
            </div>
            <button onclick="exportCSV()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-white flex items-center gap-2 transition-colors">
                <i data-lucide="download" class="w-4 h-4 text-brand-primary"></i>
                <span>Export CSV Ledger</span>
            </button>
        </div>

        <!-- Filter & Search Controls -->
        <div class="glass-card rounded-2xl p-4 border border-dark-border flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <button onclick="filterType('all', this)" class="tx-filter-btn px-3.5 py-1.5 rounded-xl bg-brand-primary text-white text-xs font-bold">All Records</button>
                <button onclick="filterType('deposit', this)" class="tx-filter-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs font-bold">Deposits</button>
                <button onclick="filterType('withdrawal', this)" class="tx-filter-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs font-bold">Withdrawals</button>
                <button onclick="filterType('yield', this)" class="tx-filter-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs font-bold">Dividends</button>
                <button onclick="filterType('trade', this)" class="tx-filter-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs font-bold">Trades</button>
            </div>

            <div class="w-full md:w-72">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="tx-search-input" oninput="searchLedger(this.value)" placeholder="Search TX hash, asset, amount..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white outline-none focus:border-brand-primary">
                </div>
            </div>
        </div>

        <!-- Transaction Table -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 border border-dark-border space-y-4">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs" id="ledger-table">
                    <thead>
                        <tr class="border-b border-dark-border text-slate-400 font-bold uppercase tracking-wider">
                            <th class="py-3 px-3">Transaction Type</th>
                            <th class="py-3 px-3">Gross Amount</th>
                            <th class="py-3 px-3">Asset</th>
                            <th class="py-3 px-3">Reference / Hash</th>
                            <th class="py-3 px-3">Timestamp</th>
                            <th class="py-3 px-3 text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-dark-border/50 text-slate-300" id="ledger-tbody">
                        <tr><td colspan="6" class="py-8 text-center text-slate-500 font-mono text-xs">Loading ledger records from database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Universal Footer -->
    <footer id="app-footer"></footer>

    <!-- Scripts -->
    <script src="/assets/js/app-core.js"></script>
    <script>
        let allTransactions = [];

        document.addEventListener('DOMContentLoaded', () => {
            AppCore.init('transactions');
            loadLedgerData();
        });

        async function loadLedgerData() {
            allTransactions = await AppCore.getRealTransactions();
            renderLedger(allTransactions);
        }
        window.reloadPageData = loadLedgerData;

        function renderLedger(list) {
            const tbody = document.getElementById('ledger-tbody');
            if (!tbody) return;

            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-500 font-mono text-xs">No transactions recorded in database yet. Deposit, trade, or withdraw to generate live activity.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(tx => {
                const type = tx.type || 'transaction';
                const isPositive = type === 'deposit' || type === 'yield' || (type === 'trade' && tx.amount > 0);
                const amtFormatted = (isPositive ? '+' : '-') + '$' + Math.abs(tx.amount).toFixed(2);
                const amtClass = isPositive ? 'text-emerald-400' : 'text-red-400';
                
                let icon = 'activity';
                let iconColor = 'text-blue-400';
                let iconBg = 'bg-blue-500/20';
                let subtitle = 'System Event';

                if (type === 'deposit') {
                    icon = 'arrow-down-left';
                    iconColor = 'text-emerald-400';
                    iconBg = 'bg-emerald-500/20';
                    subtitle = `${tx.currency || 'Crypto'} Inbound`;
                } else if (type === 'withdrawal') {
                    icon = 'arrow-up-right';
                    iconColor = 'text-amber-400';
                    iconBg = 'bg-amber-500/20';
                    subtitle = `${tx.currency || 'Asset'} Payout`;
                } else if (type === 'trade') {
                    icon = 'trending-up';
                    iconColor = 'text-emerald-400';
                    iconBg = 'bg-emerald-500/20';
                    subtitle = 'Algorithmic Execution';
                } else if (type === 'yield') {
                    icon = 'pie-chart';
                    iconColor = 'text-purple-400';
                    iconBg = 'bg-purple-500/20';
                    subtitle = 'Yield Dividend';
                }

                const hashDisplay = tx.tx_hash ? (tx.tx_hash.length > 14 ? tx.tx_hash.substr(0, 8) + '...' + tx.tx_hash.substr(-4) : tx.tx_hash) : 'Audited Vault';
                const dateDisplay = tx.created_at ? new Date(tx.created_at).toLocaleString() : 'Recent';
                const status = tx.status || 'completed';

                return `
                    <tr class="hover:bg-slate-900/40" data-type="${type}">
                        <td class="py-4 px-3 font-semibold text-white flex items-center gap-2">
                            <span class="p-1.5 rounded-lg ${iconBg} ${iconColor}"><i data-lucide="${icon}" class="w-4 h-4"></i></span>
                            <div>
                                <span class="font-bold block text-white capitalize">${type}</span>
                                <span class="text-[10px] text-slate-500">${subtitle}</span>
                            </div>
                        </td>
                        <td class="py-4 px-3 font-mono font-bold ${amtClass}">${amtFormatted}</td>
                        <td class="py-4 px-3 font-bold">${tx.currency || 'USD'}</td>
                        <td class="py-4 px-3 font-mono text-slate-400">${hashDisplay}</td>
                        <td class="py-4 px-3 text-slate-400">${dateDisplay}</td>
                        <td class="py-4 px-3 text-right">
                            <span class="px-2.5 py-1 rounded-full ${status === 'completed' || status === 'confirmed' || status === 'won' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'} font-bold capitalize text-[11px]">${status}</span>
                        </td>
                    </tr>
                `;
            }).join('');
            if (window.lucide) lucide.createIcons();
        }

        function filterType(type, btn) {
            document.querySelectorAll('.tx-filter-btn').forEach(b => {
                b.className = 'tx-filter-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs font-bold';
            });
            btn.className = 'tx-filter-btn px-3.5 py-1.5 rounded-xl bg-brand-primary text-white text-xs font-bold';

            if (type === 'all') {
                renderLedger(allTransactions);
            } else {
                renderLedger(allTransactions.filter(t => t.type === type));
            }
        }

        function searchLedger(query) {
            const q = query.toLowerCase();
            const filtered = allTransactions.filter(t => {
                const searchStr = `${t.type || ''} ${t.currency || ''} ${t.tx_hash || ''} ${t.amount || ''} ${t.status || ''}`.toLowerCase();
                return searchStr.includes(q);
            });
            renderLedger(filtered);
        }

        function exportCSV() {
            if (!allTransactions || allTransactions.length === 0) {
                AppCore.showToast('No Records', 'There are no ledger records to export.', 'error');
                return;
            }
            let csv = 'Type,Amount,Asset,Reference,Date,Status\n';
            allTransactions.forEach(t => {
                csv += `"${t.type}","${t.amount}","${t.currency || 'USD'}","${t.tx_hash || ''}","${t.created_at || ''}","${t.status || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `emporium-ledger-${Date.now()}.csv`;
            a.click();
            AppCore.showToast('Export Ready', 'Ledger exported as CSV successfully.');
        }
    </script>
</body>
</html>
